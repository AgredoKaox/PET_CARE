<!DOCTYPE html>
<!-- PetCare — Inicio de sesión | Versión 1.0 -->
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — PetCare</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/components/menu.js" defer></script>
  <script src="../assets/js/components/tabs.js" defer></script>
  <script src="../assets/js/components/modal.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <main id="contenido" class="hero hero--auth">
    <section class="auth-form" aria-labelledby="titulo-login">
      <a class="auth-form__brand" href="../index.html">PetCare</a>
      <h1 id="titulo-login" class="auth-form__title">Iniciar sesión</h1>
      <p class="auth-form__subtitle">Accede a la plataforma de salud animal.</p>

      <nav class="auth-form__tabs" aria-label="Acceso">
        <a class="auth-form__tab auth-form__tab--active" href="login.html" aria-current="page">Iniciar sesión</a>
        <a class="auth-form__tab" href="registro.html">Crear cuenta</a>
      </nav>

      <form class="auth-form__form" action="#">
        <div class="auth-form__field">
          <label class="auth-form__label" for="correo">Correo electrónico</label>
          <input class="auth-form__input" id="correo" name="correo" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
        </div>
        <div class="auth-form__field">
          <label class="auth-form__label" for="contrasena">Contraseña</label>
          <input class="auth-form__input" id="contrasena" name="contrasena" type="password" autocomplete="current-password">
          <a class="auth-form__link" href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <button class="button button--primary button--lg" type="submit">Iniciar sesión</button>
      </form>

      <div class="auth-form__footer">
        <span>¿No tienes una cuenta? <a class="auth-form__link" href="registro.html">Crear cuenta</a></span>
      </div>
    </section>
  </main>
</body>
</html>
